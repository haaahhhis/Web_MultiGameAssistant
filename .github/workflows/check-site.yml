name: Check static site

on:
  pull_request:
  push:
    branches: [main]

permissions:
  contents: read

jobs:
  check:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '24'
      - run: node scripts/version-assets.mjs --check
      - run: node --test scripts/*.test.mjs demo-build/scenarios/clock.test.mjs
      - run: |
          for script in assets/js/*.js scripts/*.mjs; do
            node --check "$script"
          done
